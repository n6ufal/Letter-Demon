[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "letter-demon"
version = "9.3.0"
description = "Windows desktop typing assistant for a Roblox word game"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alif Naufal", email = "boxcarr@proton.me"},
]
requires-python = ">=3.10"
dependencies = [
    "keyboard>=0.13.5",
]

[project.urls]
Repository = "https://github.com/n6ufal/Letter-Demon"

[tool.setuptools.packages.find]
include = ["config*", "core*", "system*", "ui*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E4", "I", "W"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "system", "ui", "tests"]
combine-as-imports = true
